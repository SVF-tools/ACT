# ============================================================================
# ACT Net Generation Configuration
# ============================================================================
#
# This file controls the random generation of ACT neural network instances.
# Modify these settings to customize the generated networks.
#
# Rule Types Available:
#   choice:      Pick one value randomly from a list
#   range:       Pick integer uniformly from [min, max]
#   weighted:    Pick value with specified probability weights
#   repeat:      Generate a list by repeating a sampling rule
#   probability: Boolean with given probability of True
#   const:       Fixed constant value
#
# ============================================================================


# ============================================================================
# 1. BASIC SETTINGS
# ============================================================================
# Controls how many networks to generate and where to save them.

common:
  # --- Generation Control ---
  num_instances: 15                 # How many networks to generate per run
  base_seed: null                   # Random seed for reproducibility (null = random each run)
  name_prefix: cfg_seed             # Prefix for generated network filenames

  # --- Output Location ---
  output_dir: act/back_end/examples/nets                        # Directory to save generated .json files
  write_manifest: true                                          # Generate manifest.json listing all networks
  manifest_path: act/back_end/examples/nets/_meta/manifest.json # Path to manifest file

  # --- Computation Settings ---
  dtype: torch.float64              # Data type for weights (float32 or float64)

  # --- Coverage Mode (Advanced) ---
  coverage_mode: basic              # Generation mode: basic = fixed count, full = generate until target layers are covered (or max attempts)
  coverage_max_attempts: 1000       # Full mode only: maximum generation attempts before stopping (safety limit)
  coverage_report: true             # Whether to print coverage statistics after generation


# ============================================================================
# 2. MODEL FAMILY SELECTION
# ============================================================================
# Choose which types of networks to generate and their relative frequencies.

family_selection:
  weighted:
    mlp: 0.5                        # 50% chance to generate MLP (fully-connected network)
    cnn2d: 0.5                      # 50% chance to generate CNN (convolutional network)


# ============================================================================
# 3. MODEL FAMILY PARAMETERS
# ============================================================================
# Detailed configuration for each network family.

families:

  # --------------------------------------------------------------------------
  # 3.1 MLP (Multi-Layer Perceptron)
  # --------------------------------------------------------------------------
  # Fully-connected feedforward neural networks.

  mlp:
    # --- Input Configuration ---
    input_shape:
      choice: [[1, 6], [1, 16], [1, 3, 8]]    # Input tensor shapes [batch, features] or [batch, C, H]
    num_classes:
      choice: [10]                            # Number of output classes

    # --- Architecture Variant ---
    variant:
      weighted:
        plain: 0.4                            # Simple sequential Dense layers
        block: 0.3                            # Grouped Dense layers in blocks
        residual: 0.3                         # Dense layers with skip connections

    # --- Plain Variant Parameters ---
    depth:
      range: [2, 4]                           # Number of hidden layers (plain variant)
    hidden_sizes:
      repeat:
        count: { range: [2, 4] }              # How many hidden layers
        value: { choice: [32, 64, 128] }      # Width of each hidden layer

    # --- Block Variant Parameters ---
    num_blocks:
      range: [2, 6]                           # Number of blocks
    block_width:
      choice: [32, 64, 128]                   # Width of each block
    post_block_activation:
      probability: 0.8                        # Whether to add activation after each block

    # --- Residual Variant Parameters ---
    num_residual_blocks:
      range: [1, 3]                           # Number of residual blocks
    residual_width:
      choice: [32, 64, 128]                   # Width of residual blocks

    # --- Layer Settings ---
    use_bias:
      const: true                             # Enable bias in Dense layers

    # --- Activation Function ---
    activation:
      choice:                                 # Available activation functions
        - relu                                # ReLU: max(0, x)
        - tanh                                # Tanh: (e^x - e^-x) / (e^x + e^-x)
        - sigmoid                             # Sigmoid: 1 / (1 + e^-x)
        - lrelu                               # Leaky ReLU: max(alpha*x, x)
        - relu6                               # ReLU6: min(max(0, x), 6)
        - silu                                # SiLU/Swish: x * sigmoid(x)
        - abs                                 # Absolute value: |x|
        - square                              # Square: x^2
        - power                               # Power: x^p

    # --- Activation-Specific Parameters ---
    lrelu_alpha:
      choice: [0.01, 0.1, 0.2]                # LeakyReLU negative slope
    power_exponent:
      choice: [2.0, 3.0, 0.5]                 # Power exponent (square, cube, sqrt)


  # --------------------------------------------------------------------------
  # 3.2 CNN2D (2D Convolutional Network)
  # --------------------------------------------------------------------------
  # Convolutional neural networks for 2D inputs (images).

  cnn2d:
    # --- Input Configuration ---
    input_shape:
      choice: [[1, 1, 8, 8], [1, 3, 16, 16]]  # Input shapes [batch, channels, height, width]
    num_classes:
      choice: [10]                            # Number of output classes

    # --- Architecture Variant ---
    variant:
      weighted:
        plain: 0.4                            # Simple sequential Conv layers
        residual: 0.3                         # Conv blocks with skip connections
        stage: 0.3                            # Staged architecture (like ResNet)

    # --- Plain Variant Parameters ---
    num_blocks:
      range: [1, 3]                           # Number of conv blocks
    conv_channels:
      repeat:
        count: { range: [1, 3] }              # How many conv layers
        value: { choice: [8, 16, 32] }        # Output channels per conv layer
    fc_hidden:
      choice: [32, 64, 128]                   # Hidden units in final FC layer

    # --- Residual Variant Parameters ---
    num_residual_blocks:
      range: [2, 4]                           # Number of residual blocks (with skip connections)
    residual_channels:
      choice: [16, 32, 64]                    # Channel width for residual blocks

    # --- Stage Variant Parameters ---
    stages:
      range: [1, 3]                           # Number of stages
    blocks_per_stage:
      range: [1, 2]                           # Conv blocks per stage
    base_channels:
      choice: [8, 16, 32]                     # Initial channel count
    channel_mult:
      choice: [2]                             # Channel multiplier between stages
    double_conv_p:
      choice: [0.5, 0.7]                      # Probability of double convolution
    head_pool_to_1x1:
      const: true                             # Use global pooling before FC head

    # --- Convolution Settings ---
    kernel_sizes:
      choice: [3]                             # Conv kernel size
    strides:
      choice: [1]                             # Conv stride
    paddings:
      choice: [1]                             # Conv padding
    use_bias:
      const: true                             # Enable bias in Conv/FC layers

    # --- Pooling Settings ---
    use_pooling:
      probability: 0.5                        # Whether to use pooling layers
    pool_kind:
      choice: [maxpool, avgpool, none]        # Type of pooling
    pool_kernel:
      const: 2                                # Pooling kernel size
    pool_stride:
      const: 2                                # Pooling stride
    downsample:
      choice: [maxpool, avgpool, stride2_conv] # Downsampling method between stages

    # --- Activation Function ---
    activation:
      choice:                                 # Available activation functions
        - relu                                # ReLU: max(0, x)
        - tanh                                # Tanh
        - sigmoid                             # Sigmoid
        - lrelu                               # Leaky ReLU
        - relu6                               # ReLU6
        - silu                                # SiLU/Swish
        - abs                                 # Absolute value
        - square                              # Square

    # --- Activation-Specific Parameters ---
    lrelu_alpha:
      choice: [0.01, 0.1, 0.2]                # LeakyReLU negative slope


# ============================================================================
# 4. INPUT SPECIFICATION
# ============================================================================
# Defines the input domain constraints for verification.

input_spec:
  # --- Constraint Type ---
  kind:
    weighted:
      BOX: 0.5                                # Axis-aligned box bounds: lb[i] <= x[i] <= ub[i]
      LINF_BALL: 0.5                          # L∞ ball: ||x - center||_∞ <= eps

  # --- BOX Constraint Parameters ---
  value_range:
    choice: [[0.0, 1.0]]                      # Base value range [min, max] for inputs
  box_shrink_range: [0.0, 0.2]                # Random shrinkage factor applied to box bounds

  # --- LINF_BALL Constraint Parameters ---
  eps:
    choice: [0.03, 0.05, 0.1]                 # Perturbation radius epsilon


# ============================================================================
# 5. OUTPUT SPECIFICATION
# ============================================================================
# Defines the verification property to check on the output.

output_spec:
  # --- Property Type ---
  kind:
    weighted:
      TOP1_ROBUST: 0.4                        # Correct class has highest logit
      MARGIN_ROBUST: 0.4                      # Correct class wins by margin m
      LINEAR_LE: 0.1                          # Linear inequality: c·y <= d
      RANGE: 0.1                              # Output bounds: lb <= y <= ub

  # --- MARGIN_ROBUST Parameters ---
  margin:
    choice: [0.0, 0.1, 1.0]                   # Required margin between classes

  # --- LINEAR_LE Parameters ---
  linear_le_c_range: [-1.0, 1.0]              # Coefficient range for c vector
  linear_le_d_range: [-1.0, 1.0]              # Constant d threshold

  # --- RANGE Parameters ---
  range_bounds:
    choice: [[-1.0, 1.0]]                     # Output bounds [lb, ub]