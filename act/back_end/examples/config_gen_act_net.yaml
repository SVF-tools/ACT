# ============================================================================
# ACT Net Generation Config V2 (Categorized for Paper/Documentation)
# ============================================================================
# Design Principle: All sampling logic defined declaratively in YAML.
# Rule Types: choice, range, weighted, repeat, probability, const.
# Structure: Organized by configuration category for clear presentation.
# ============================================================================

# ============================================================================
# 1. COMMON / GLOBAL SETTINGS
# ============================================================================
# These settings apply to all network types and control the generation process.

common:
  num_instances: 5              # Number of networks to generate per run
  base_seed: null               # Seed for reproducibility (null = random)
  name_prefix: cfg_seed         # Prefix for generated network names
  output_dir: act/back_end/examples/nets  # Output directory for JSON files
  write_manifest: true          # Whether to write manifest.json
  manifest_path: null           # Custom manifest path (null = auto)
  dtype: torch.float64          # Data type for weights and computations


# ============================================================================
# 2. FUNCTIONAL GROUPS (Validation & Specification)
# ============================================================================
# These configurations control input/output validation and constraints.

input_spec:
  # Input specification defines the domain of valid inputs
  kind:
    weighted:
      BOX: 0.5                  # Box constraints (axis-aligned bounds)
      LINF_BALL: 0.5            # L-infinity ball (epsilon around center)
  value_range:
    choice: [[0.0, 1.0]]        # Base value range for inputs
  box_shrink_range: [0.0, 0.2]  # Shrinkage factor for BOX constraints
  eps:
    choice: [0.03, 0.05, 0.1]   # Epsilon values for LINF_BALL

output_spec:
  # Output specification defines verification properties
  kind:
    weighted:
      TOP1_ROBUST: 0.4          # Top-1 robustness (correct class wins)
      MARGIN_ROBUST: 0.4        # Margin robustness (win by margin)
      LINEAR_LE: 0.1            # Linear inequality constraint
      RANGE: 0.1                # Output range constraint
  margin:
    choice: [0.0, 0.1, 1.0]     # Margin values for MARGIN_ROBUST
  linear_le_c_range: [-1.0, 1.0]  # Coefficient range for LINEAR_LE
  linear_le_d_range: [-1.0, 1.0]  # Constant range for LINEAR_LE
  range_bounds:
    choice: [[-1.0, 1.0]]       # Bounds for RANGE constraints


# ============================================================================
# 3. MODEL FAMILY SELECTION STRATEGY
# ============================================================================
# Defines how to sample from different network architectures.
# Each family is a preset configuration with specific characteristics:
# - Scale: tiny (fast CI), small, medium, wide, deep
# - Structure: plain, block, residual (MLP); plain, stage (CNN)
# - Downsampling: maxpool, avgpool, stride2_conv (CNN)

family_selection:
  weighted:
    # MLP Families (7 variants, total weight: 0.62)
    mlp_tiny_plain: 0.08        # Tiny MLP for CI/fast testing
    mlp_small_plain: 0.10       # Small standard MLP
    mlp_medium_plain: 0.10      # Medium-sized MLP
    mlp_wide_plain: 0.09        # Wide MLP (large hidden units)
    mlp_deep_plain: 0.08        # Deep MLP (many layers)
    mlp_block: 0.10             # Block-structured MLP
    mlp_residual: 0.07          # MLP with residual connections

    # CNN2D Families (6 variants, total weight: 0.45)
    cnn_tiny_plain: 0.07        # Tiny CNN for small images
    cnn_small_plain: 0.08       # Small standard CNN
    cnn_plain_maxpool: 0.08     # Plain CNN with maxpool
    cnn_stage_maxpool: 0.08     # Staged CNN with maxpool downsampling
    cnn_stage_stride2: 0.07     # Staged CNN with strided conv downsampling
    cnn_wide_stage: 0.07        # Wide staged CNN (more channels)


# ============================================================================
# 4. FAMILY-SPECIFIC PARAMETERS
# ============================================================================
# Each family has a 'type' (mlp or cnn2d) and specific parameter presets.
# All families include all parameters (using 'const' for unused ones) to
# ensure consistent sampling without special-case logic.

families:
  # ==========================================================================
  # 4.1 MLP FAMILIES
  # ==========================================================================

  # --------------------------------------------------------------------------
  # MLP Tiny Plain - Fast, minimal MLP for CI/testing
  # --------------------------------------------------------------------------
  mlp_tiny_plain:
    type: mlp                   # Builder type
    input_shape:
      choice: [[1, 6], [1, 8]]  # Very small inputs
    hidden_sizes:
      repeat:
        count: { const: 2 }
        value: { choice: [16, 32] }  # Small hidden units
    activation:
      choice: [relu, tanh]
    variant:
      const: plain              # Plain variant only
    num_blocks:
      const: 1                  # Not used (plain variant)
    block_width:
      const: 32                 # Not used
    post_block_activation:
      const: false              # Not used
    num_residual_blocks:
      const: 1                  # Not used
    residual_width:
      const: 32                 # Not used
    use_bias:
      const: true
    num_classes:
      choice: [5, 10]           # Small number of classes

  # --------------------------------------------------------------------------
  # MLP Small Plain - Standard small MLP
  # --------------------------------------------------------------------------
  mlp_small_plain:
    type: mlp
    input_shape:
      choice: [[1, 16], [1, 3, 8]]
    hidden_sizes:
      repeat:
        count: { range: [2, 3] }
        value: { choice: [32, 64] }
    activation:
      choice: [relu, tanh, sigmoid]
    variant:
      const: plain
    num_blocks:
      const: 1
    block_width:
      const: 32
    post_block_activation:
      const: false
    num_residual_blocks:
      const: 1
    residual_width:
      const: 32
    use_bias:
      const: true
    num_classes:
      choice: [10]

  # --------------------------------------------------------------------------
  # MLP Medium Plain - Medium-sized standard MLP
  # --------------------------------------------------------------------------
  mlp_medium_plain:
    type: mlp
    input_shape:
      choice: [[1, 16], [1, 32], [1, 3, 16]]
    hidden_sizes:
      repeat:
        count: { range: [3, 4] }
        value: { choice: [64, 128] }
    activation:
      choice: [relu, tanh]
    variant:
      const: plain
    num_blocks:
      const: 1
    block_width:
      const: 64
    post_block_activation:
      const: false
    num_residual_blocks:
      const: 1
    residual_width:
      const: 64
    use_bias:
      const: true
    num_classes:
      choice: [10]

  # --------------------------------------------------------------------------
  # MLP Wide Plain - Wide MLP (large hidden units)
  # --------------------------------------------------------------------------
  mlp_wide_plain:
    type: mlp
    input_shape:
      choice: [[1, 16], [1, 32]]
    hidden_sizes:
      repeat:
        count: { range: [2, 3] }
        value: { choice: [128, 256] }  # Large hidden units
    activation:
      choice: [relu, tanh]
    variant:
      const: plain
    num_blocks:
      const: 1
    block_width:
      const: 128
    post_block_activation:
      const: false
    num_residual_blocks:
      const: 1
    residual_width:
      const: 128
    use_bias:
      const: true
    num_classes:
      choice: [10]

  # --------------------------------------------------------------------------
  # MLP Deep Plain - Deep MLP (many layers)
  # --------------------------------------------------------------------------
  mlp_deep_plain:
    type: mlp
    input_shape:
      choice: [[1, 16], [1, 32]]
    hidden_sizes:
      repeat:
        count: { range: [4, 6] }
        value: { choice: [32, 64] }  # Moderate width
    activation:
      choice: [relu, tanh]
    variant:
      const: plain
    num_blocks:
      const: 1
    block_width:
      const: 64
    post_block_activation:
      const: false
    num_residual_blocks:
      const: 1
    residual_width:
      const: 64
    use_bias:
      const: true
    num_classes:
      choice: [10]

  # --------------------------------------------------------------------------
  # MLP Block - Block-structured MLP
  # --------------------------------------------------------------------------
  mlp_block:
    type: mlp
    input_shape:
      choice: [[1, 16], [1, 3, 8]]
    hidden_sizes:
      repeat:
        count: { range: [2, 4] }
        value: { choice: [32, 64, 128] }
    activation:
      choice: [relu, tanh, sigmoid]
    variant:
      const: block              # Block variant
    num_blocks:
      range: [2, 4]             # Active parameter
    block_width:
      choice: [32, 64, 128]     # Active parameter
    post_block_activation:
      probability: 0.8          # Active parameter
    num_residual_blocks:
      const: 1                  # Not used
    residual_width:
      const: 32                 # Not used
    use_bias:
      const: true
    num_classes:
      choice: [10]

  # --------------------------------------------------------------------------
  # MLP Residual - MLP with residual connections
  # --------------------------------------------------------------------------
  mlp_residual:
    type: mlp
    input_shape:
      choice: [[1, 16], [1, 32], [1, 3, 16]]
    hidden_sizes:
      repeat:
        count: { range: [3, 5] }
        value: { choice: [64, 128] }
    activation:
      choice: [relu, tanh]
    variant:
      const: residual           # Residual variant
    num_blocks:
      const: 1                  # Not used
    block_width:
      const: 64                 # Not used
    post_block_activation:
      const: false              # Not used
    num_residual_blocks:
      range: [2, 4]             # Active: number of residual blocks
    residual_width:
      choice: [64, 128]         # Active: width of residual connections
    use_bias:
      const: true
    num_classes:
      choice: [10]

  # ==========================================================================
  # 4.2 CNN2D FAMILIES
  # ==========================================================================

  # --------------------------------------------------------------------------
  # CNN Tiny Plain - Minimal CNN for small images
  # --------------------------------------------------------------------------
  cnn_tiny_plain:
    type: cnn2d                 # Builder type
    input_shape:
      choice: [[1, 1, 8, 8]]    # Very small images
    variant:
      const: plain              # Plain variant only
    num_blocks:
      const: 1                  # Single conv block
    conv_channels:
      repeat:
        count: { const: 1 }
        value: { choice: [8, 16] }  # Small channels
    kernel_sizes:
      const: 3
    strides:
      const: 1
    paddings:
      const: 1
    use_maxpool:
      const: false              # No pooling
    maxpool_kernel:
      const: 2
    maxpool_stride:
      const: 2
    fc_hidden:
      choice: [16, 32]          # Small FC
    stages:
      const: 1                  # Not used
    blocks_per_stage:
      const: 1                  # Not used
    base_channels:
      const: 8                  # Not used
    channel_mult:
      const: 2                  # Not used
    downsample:
      const: maxpool            # Not used
    double_conv_p:
      const: 0.5                # Not used
    head_pool_to_1x1:
      const: true
    activation:
      choice: [relu, tanh]
    use_bias:
      const: true
    num_classes:
      choice: [5, 10]

  # --------------------------------------------------------------------------
  # CNN Small Plain - Standard small CNN
  # --------------------------------------------------------------------------
  cnn_small_plain:
    type: cnn2d
    input_shape:
      choice: [[1, 1, 8, 8], [1, 3, 16, 16]]
    variant:
      const: plain
    num_blocks:
      range: [1, 2]
    conv_channels:
      repeat:
        count: { range: [1, 2] }
        value: { choice: [8, 16, 32] }
    kernel_sizes:
      const: 3
    strides:
      const: 1
    paddings:
      const: 1
    use_maxpool:
      probability: 0.3
    maxpool_kernel:
      const: 2
    maxpool_stride:
      const: 2
    fc_hidden:
      choice: [32, 64]
    stages:
      const: 1
    blocks_per_stage:
      const: 1
    base_channels:
      const: 8
    channel_mult:
      const: 2
    downsample:
      const: maxpool
    double_conv_p:
      const: 0.5
    head_pool_to_1x1:
      const: true
    activation:
      choice: [relu, tanh, sigmoid]
    use_bias:
      const: true
    num_classes:
      choice: [10]

  # --------------------------------------------------------------------------
  # CNN Plain Maxpool - Plain CNN with maxpool layers
  # --------------------------------------------------------------------------
  cnn_plain_maxpool:
    type: cnn2d
    input_shape:
      choice: [[1, 1, 8, 8], [1, 3, 16, 16]]
    variant:
      const: plain
    num_blocks:
      range: [2, 3]
    conv_channels:
      repeat:
        count: { range: [2, 3] }
        value: { choice: [8, 16, 32] }
    kernel_sizes:
      const: 3
    strides:
      const: 1
    paddings:
      const: 1
    use_maxpool:
      const: true               # Always use maxpool
    maxpool_kernel:
      const: 2
    maxpool_stride:
      const: 2
    fc_hidden:
      choice: [32, 64, 128]
    stages:
      const: 1
    blocks_per_stage:
      const: 1
    base_channels:
      const: 16
    channel_mult:
      const: 2
    downsample:
      const: maxpool
    double_conv_p:
      const: 0.5
    head_pool_to_1x1:
      const: true
    activation:
      choice: [relu, tanh]
    use_bias:
      const: true
    num_classes:
      choice: [10]

  # --------------------------------------------------------------------------
  # CNN Stage Maxpool - Staged CNN with maxpool downsampling
  # --------------------------------------------------------------------------
  cnn_stage_maxpool:
    type: cnn2d
    input_shape:
      choice: [[1, 3, 16, 16], [1, 3, 32, 32]]
    variant:
      const: stage              # Stage variant
    num_blocks:
      const: 1                  # Not used (stage variant)
    conv_channels:
      repeat:
        count: { const: 1 }
        value: { const: 16 }    # Not used
    kernel_sizes:
      const: 3
    strides:
      const: 1
    paddings:
      const: 1
    use_maxpool:
      const: false              # Controlled by downsample
    maxpool_kernel:
      const: 2
    maxpool_stride:
      const: 2
    fc_hidden:
      const: 64                 # Not used (stage variant)
    stages:
      range: [2, 3]             # Active parameter
    blocks_per_stage:
      range: [1, 2]             # Active parameter
    base_channels:
      choice: [8, 16]           # Active parameter
    channel_mult:
      const: 2                  # Active parameter
    downsample:
      const: maxpool            # Active parameter
    double_conv_p:
      choice: [0.5, 0.7]        # Active parameter
    head_pool_to_1x1:
      const: true
    activation:
      choice: [relu, tanh]
    use_bias:
      const: true
    num_classes:
      choice: [10]

  # --------------------------------------------------------------------------
  # CNN Stage Stride2 - Staged CNN with strided conv downsampling
  # --------------------------------------------------------------------------
  cnn_stage_stride2:
    type: cnn2d
    input_shape:
      choice: [[1, 3, 16, 16], [1, 3, 32, 32]]
    variant:
      const: stage
    num_blocks:
      const: 1
    conv_channels:
      repeat:
        count: { const: 1 }
        value: { const: 16 }
    kernel_sizes:
      const: 3
    strides:
      const: 1
    paddings:
      const: 1
    use_maxpool:
      const: false
    maxpool_kernel:
      const: 2
    maxpool_stride:
      const: 2
    fc_hidden:
      const: 64
    stages:
      range: [2, 3]
    blocks_per_stage:
      range: [1, 2]
    base_channels:
      choice: [8, 16, 32]
    channel_mult:
      const: 2
    downsample:
      const: stride2_conv       # Strided conv downsampling
    double_conv_p:
      choice: [0.5, 0.7]
    head_pool_to_1x1:
      const: true
    activation:
      choice: [relu, tanh]
    use_bias:
      const: true
    num_classes:
      choice: [10]

  # --------------------------------------------------------------------------
  # CNN Wide Stage - Wide staged CNN (more channels)
  # --------------------------------------------------------------------------
  cnn_wide_stage:
    type: cnn2d
    input_shape:
      choice: [[1, 3, 16, 16], [1, 3, 32, 32]]
    variant:
      const: stage
    num_blocks:
      const: 1
    conv_channels:
      repeat:
        count: { const: 1 }
        value: { const: 32 }
    kernel_sizes:
      const: 3
    strides:
      const: 1
    paddings:
      const: 1
    use_maxpool:
      const: false
    maxpool_kernel:
      const: 2
    maxpool_stride:
      const: 2
    fc_hidden:
      const: 128
    stages:
      range: [2, 3]
    blocks_per_stage:
      range: [1, 2]
    base_channels:
      choice: [16, 32, 64]      # Wide base channels
    channel_mult:
      const: 2
    downsample:
      choice: [maxpool, stride2_conv]
    double_conv_p:
      choice: [0.5, 0.7]
    head_pool_to_1x1:
      const: true
    activation:
      choice: [relu, tanh]
    use_bias:
      const: true
    num_classes:
      choice: [10]
