name: ACT BaB Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}
  ACT_NETS_DIR: act/back_end/examples/nets
  ACT_CI_MODE: "true"
  ACT_SOLVER: "torchlp"
  ACT_DEVICE: "cpu"
  ACT_DTYPE: "float64"

jobs:
  bab-tests:
    name: Branch-and-Bound Tests
    runs-on: ubuntu-latest
    steps:
      # ── Setup ──────────────────────────────────────────────────────────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Clean pip cache
        run: |
          pip cache purge

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage torch onnx onnx2torch "onnx-simplifier" "onnxsim==0.6.5" pandas numpy scipy pyyaml tqdm psutil

      # ── Generate artificial ACT nets (NetFactory) ──────────────────────
      - name: Cache generated networks
        id: nets-cache
        uses: actions/cache@v4
        with:
          path: act/back_end/examples/nets
          key: act-nets-${{ hashFiles('act/config/gen_act_net.yaml', 'act/back_end/net_factory.py', 'act/config/backend.yaml') }}
          restore-keys: |
            act-nets-

      - name: Generate example networks
        if: steps.nets-cache.outputs.cache-hit != 'true'
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.back_end --generate

      # ── VNNLIB benchmarks: cache + download (network; consumed below) ──
      - name: Cache VNNLIB benchmarks
        id: vnnlib-cache
        uses: actions/cache@v4
        with:
          path: data/vnnlib
          key: vnnlib-acasxu-distshift-safenlp-v2

      - name: VNNLIB — download benchmarks
        run: |
          cd ${{ github.workspace }}
          for cat in acasxu_2023 dist_shift_2023 safenlp_2024 relusplitter_2026 isomorphic_acasxu_2026; do
            coverage run -p -m act.front_end --download $cat
          done

      # ===================================================================
      # Input-domain-splitting BaB on acasxu (width branching + n-ary input
      # splits): exercises InputBranching, split_input_nary, and the bab
      # input-split loop that neuron-splitting steps never reach.
      # ===================================================================
      - name: BaB on VNNLIB — acasxu input splitting (width branching)
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.pipeline --verify vnnlib --category acasxu_2023 --max-instances 1 \
            --solvers dual --bab --bab-branching-method width --bab-input-split-fanout 2 \
            --bab-max-depth 8 --bab-max-nodes 200 --device cpu --dtype float64

      # ===================================================================
      # ReluSplitter 2026: download + ONNX load + verify E2E over the base
      # model and a split (pct) variant of the same instance.
      # ===================================================================
      - name: VNNLIB E2E — relusplitter_2026 (base + split model load)
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.pipeline --verify vnnlib --category relusplitter_2026 --max-instances 2 --merge-split-relus \
            --solvers dual --device cpu --dtype float64

      # ===================================================================
      # Isomorphic dual-network specs (2026): _isomorphic_multinet_rewrite,
      # _CombinedDualModel loading, multi-row LINEAR_LE conjunction encode.
      # ===================================================================
      - name: VNNLIB E2E — isomorphic_acasxu_2026 (dual-network specs)
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.pipeline --verify vnnlib --category isomorphic_acasxu_2026 --max-instances 1 \
            --solvers dual --device cpu --dtype float64

      # ===================================================================
      # LP_EMBEDDING input-domain splits on safenlp: perturbed-embedding
      # branching mask + per-token radius rederivation on BaB children.
      # ===================================================================
      - name: BaB on VNNLIB — safenlp LP_EMBEDDING input splitting
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.pipeline --verify vnnlib --category safenlp_2024 --max-instances 1 \
            --solvers dual --bab --bab-branching-method width --bab-input-split-fanout 2 \
            --bab-max-depth 6 --bab-max-nodes 100 --device cpu --dtype float64

      # ===================================================================
      # LLM-probe BaB controller with the offline deterministic mock backend:
      # begin_wave/advise/end_wave plumbing in verify_bab_batched.
      # ===================================================================
      - name: BaB LLM-probe controller (mock backend)
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.back_end --verify --network act/back_end/examples/nets/layer_testing_bab_deep.json \
            --bab --bab-llm-probe-enabled --bab-llm-probe-backend mock \
            --bab-llm-probe-decisions split,frontier,refine,neuron --bab-llm-probe-log \
            --device cpu --dtype float64

      # ===================================================================
      # NEURON SPLIT and MULTI-SPLIT invariants are asserted in node.py and bab.py.
      # Exit status 0 means every lane received a verdict; stdout is not validation.
      # ===================================================================
      - name: BaB gain branching + multi-split
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.back_end --verify --network act/back_end/examples/nets/layer_testing_bab_deep.json \
            --solver dual --bab --bab-branching gain --bab-multi-split-levels 3 \
            --bab-max-depth 4 --bab-max-subproblems 40 --device cpu --dtype float64

      # Joint-split depth, counters, and child cubes are asserted in bab.py and node.py.
      # Exit status 0 means every lane received a verdict; stdout is not validation.
      - name: BaB joint multi-split — decoupled from gain (babsr + dual_alpha_eta)
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.back_end --verify \
            --network "$ACT_NETS_DIR/mlp_plain_3x8_64x64_3962224133.json" \
            --solver dual --bab --bab-branching babsr --bab-solver-tier dual_alpha_eta \
            --bab-multi-split-levels 3 --bab-max-batch-size 256 \
            --bab-max-depth 6 --bab-max-subproblems 60 \
            --device cpu --dtype float64 --verbose

      # Witness decision and neuron-split invariants are asserted in branching.py and node.py.
      # Exit status 0 means every lane received a verdict; stdout is not validation.
      - name: BaB branching — witness residual (dual_alpha_eta)
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.back_end --verify \
            --network "$ACT_NETS_DIR/mlp_plain_3x8_64x64_3962224133.json" \
            --solver dual --bab --bab-branching witness_residual \
            --bab-solver-tier dual_alpha_eta --bab-multi-split-levels 1 \
            --bab-max-batch-size 64 --bab-max-depth 5 --bab-max-subproblems 30 \
            --device cpu --dtype float64 --verbose

      # Top-k cap and pool-size invariants are asserted in branching/bounding.py.
      # Exit status 0 means every lane received a verdict.
      - name: BaB bounding — top-k parameter
        run: |
          cd ${{ github.workspace }}
          for v in depth_bound_blend greedy annealed diverse_split_signs; do
            coverage run -p -m act.back_end --verify \
              --network "$ACT_NETS_DIR/mlp_plain_3x8_64x64_3962224133.json" \
              --bab --bab-bounding $v --bab-top-k 2 \
              --solver torchlp --device cpu --dtype float64 \
              --timeout 30 --bab-max-depth 4 --bab-max-subproblems 40 --verbose
          done

      # ===================================================================
      # SST/Yelp text-method selection: select_bert_method + BackendConfig
      # text-method resolution (planar -> solver_tier).
      # ===================================================================
      - name: Text-method config resolution (planar)
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.back_end --verify --network act/back_end/examples/nets/layer_testing_bab_deep.json \
            --solver dual --method planar --device cpu --dtype float64


      # ===================================================================
      # Dual MATMUL bilinear kernel (tf_transformer): dual-tier soundness on
      # the MATMUL layer-testing net (torchlp sweep never exercises dual here).
      # ===================================================================
      - name: Dual MATMUL kernel soundness
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.pipeline --verify netfactory --validate-soundness \
            --networks layer_testing_matmul --solvers dual --batch-sizes 1 --device cpu --dtype float64

      # ===================================================================
      # Core engine & solver tiers (default branching). Baseline coverage of
      # verify_bab_batched on ACT nets + the dual α/η tiers on VNNLIB.
      # ===================================================================
      - name: Soundness — concrete counterexample cross-check (all ACT nets)
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.pipeline --verify netfactory --validate-soundness --device cpu --dtype float64 --solvers torchlp

      - name: BaB random branching + split (ACT nets)
        run: |
          cd ${{ github.workspace }}
          for net in layer_testing_bab_deep layer_testing_lrelu mlp_block_4x16_32x1_1568868034; do
            coverage run -p -m act.back_end --verify \
              --network "$ACT_NETS_DIR/$net.json" --bab \
              --timeout 30 --bab-max-depth 8 --bab-max-subproblems 300
          done

      # Dual-tier BaB: gain-tested branching with joint multi-neuron skips
      # (verify_bab_batched solver_tier=dual_alpha_eta, multi_split_levels>1).
      - name: BaB dual tier — gain + joint multi-neuron skip (ACT net)
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.back_end --verify \
            --network "$ACT_NETS_DIR/mlp_plain_3x8_64x64_3962224133.json" \
            --solver dual --bab --timeout 60 --bab-max-depth 10 --bab-max-subproblems 200 \
            --device cpu --dtype float32

      - name: BaB solver tiers — dual / dual_alpha / dual_alpha_eta (acasxu)
        run: |
          cd ${{ github.workspace }}
          for tier in dual dual_alpha dual_alpha_eta; do
            coverage run -p -m act.pipeline --verify vnnlib --category acasxu_2023 --max-instances 2 \
              --solvers dual --bab --bab-solver-tier $tier --bab-max-depth 3 --bab-max-nodes 10 \
              --device cpu --dtype float64
          done

      - name: BaB on VNNLIB — dist_shift (dual_alpha_eta)
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.pipeline --verify vnnlib --category dist_shift_2023 --max-instances 2 \
            --solvers dual --bab --bab-solver-tier dual_alpha_eta --bab-max-depth 3 --bab-max-nodes 10 \
            --device cpu --dtype float64

      - name: BaB on VNNLIB — safenlp (dual_alpha_eta)
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.pipeline --verify vnnlib --category safenlp_2024 --max-instances 2 \
            --solvers dual --bab --bab-solver-tier dual_alpha_eta --bab-max-depth 3 --bab-max-nodes 10 \
            --device cpu --dtype float64

      # ===================================================================
      # BRANCHING strategies — which neuron / dimension to split.
      # BaBSR / FSB neuron scoring (needs a dual tier).
      # ===================================================================
      - name: BaB branching — BaBSR / FSB
        run: |
          cd ${{ github.workspace }}
          for method in babsr fsb; do
            coverage run -p -m act.pipeline --verify vnnlib --category acasxu_2023 --max-instances 1 \
              --solvers dual --bab --bab-solver-tier dual_alpha_eta \
              --bab-branching-method $method \
              --bab-max-depth 3 --bab-max-nodes 10 --device cpu --dtype float64
          done
          coverage run -p -m act.pipeline --verify vnnlib --category acasxu_2023 --max-instances 1 \
            --solvers dual --bab --bab-solver-tier dual_alpha --bab-per-class-alpha false \
            --bab-max-depth 3 --bab-max-nodes 10 --device cpu --dtype float64
          coverage run -p -m act.pipeline --verify vnnlib --category acasxu_2023 --max-instances 1 \
            --solvers dual --bab --bab-solver-tier dual_alpha_eta --bab-no-incremental-start \
            --bab-max-depth 3 --bab-max-nodes 10 --device cpu --dtype float64

      - name: BaB branching + bounding — BaBSR + top-k pool
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.pipeline --verify vnnlib --category acasxu_2023 --max-instances 2 \
            --solvers dual --bab --bab-solver-tier dual_alpha_eta \
            --bab-bounding depth_bound_blend --bab-branching-method babsr \
            --bab-max-depth 3 --bab-max-nodes 10 --device cpu --dtype float64
      
      - name: BaB split — input split (ACT nets)
        run: |
          cd ${{ github.workspace }}
          for net in layer_testing_bab_deep layer_testing_lrelu; do
            coverage run -p -m act.back_end --verify \
              --network "$ACT_NETS_DIR/$net.json" --bab --bab-bounding depth_bound_blend \
              --bab-input-split-fanout 3 --bab-frontier-cap 8 \
              --timeout 30 --bab-max-depth 8 --bab-max-subproblems 300
          done

      # ===================================================================
      # BOUNDING strategies, tensor size is limited for computation, which 
      # keeps the top-k pending subproblems to expand next (pool)
      # selection / priority order).
      # ===================================================================
      - name: BaB bounding — top-k pool
        run: |
          cd ${{ github.workspace }}
          for net in layer_testing_bab_deep layer_testing_lrelu; do
            coverage run -p -m act.back_end --verify \
              --network "$ACT_NETS_DIR/$net.json" --bab --bab-bounding depth_bound_blend \
              --timeout 30 --bab-max-depth 8 --bab-max-subproblems 300
          done

      - name: BaB bounding — top-k order (depth_bound_blend / greedy / annealed)
        run: |
          cd ${{ github.workspace }}
          for order in depth_bound_blend greedy annealed; do
            coverage run -p -m act.back_end --verify \
              --network "$ACT_NETS_DIR/layer_testing_bab_deep.json" --bab --bab-bounding $order \
              --bab-sa-cooling-rate 0.95 \
              --timeout 30 --bab-max-depth 8 --bab-max-subproblems 300
          done

      # Pool transitions and MCTS visit-tree invariants are asserted in branching/bounding.py.
      # Exit status 0 means every lane received a verdict; stdout is not validation.
      - name: BaB bounding — greedy / SA / diverse / MCTS (ACT net)
        run: |
          cd ${{ github.workspace }}
          for opts in \
            "--bab-bounding greedy" \
            "--bab-bounding annealed --bab-sa-cooling-rate 0.95" \
            "--bab-bounding diverse_split_signs" \
            "--bab-bounding mcts --bab-solver-tier dual_alpha --bab-mcts-exploration 1.4 --bab-mcts-lambda 0.5 --bab-mcts-virtual-loss 1.0"; do
            coverage run -p -m act.back_end --verify \
              --network "$ACT_NETS_DIR/mlp_plain_3x8_64x64_3962224133.json" --bab $opts \
              --solver torchlp --device cpu --dtype float64 \
              --timeout 30 --bab-max-depth 3 --bab-max-subproblems 10 --verbose
          done

      - name: BaB split + bounding — N-ary split + SA order (VNNLIB)
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.pipeline --verify vnnlib --category acasxu_2023 --max-instances 2 \
            --solvers dual --bab --bab-solver-tier dual_alpha_eta \
            --bab-bounding annealed --bab-sa-cooling-rate 0.97 \
            --bab-input-split-fanout 3 --bab-frontier-cap 8 \
            --bab-max-depth 3 --bab-max-nodes 10 --device cpu --dtype float64

      # ── Search structure — provenance sidecar (node_id / parent_id) ──
      - name: BaB — Tracing parent and its subproblems
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.pipeline --verify vnnlib --category acasxu_2023 --max-instances 1 \
            --solvers dual --bab --bab-solver-tier dual_alpha_eta \
            --bab-bounding depth_bound_blend --bab-provenance \
            --bab-max-depth 3 --bab-max-nodes 10 --device cpu --dtype float64

      # Correctness invariants are asserted in act/back_end/bab/climb.py; a
      # violation raises "CLIMB invariant violated: ..." at the failing line.
      # Exit status 0 means every lane received a verdict. The generated net's
      # weights change whenever nets are regenerated; 250 subproblems keep core
      # learning and propagation exercised across regenerations (17-75 cores).
      - name: BaB CLIMB — certificate replay and propagation
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.back_end --verify \
            --network "$ACT_NETS_DIR/mlp_plain_3x8_64x64_3962224133.json" \
            --solver dual --bab --bab-preset climb --bab-max-batch-size 16 \
            --bab-max-depth 14 --bab-max-subproblems 250 --timeout 600 --verbose

      # These pool nets exercise symbolic MaxPool forward and cached one-hot dual
      # backward. Exit status 0 means every lane received a verdict (CERTIFIED /
      # FALSIFIED / UNKNOWN / TIMEOUT); source assertions catch invariant violations.
      - name: Dual MaxPool — symbolic forward and one-hot backward
        run: |
          cd ${{ github.workspace }}
          for net in layer_testing_cnn_pool cnn2d_plain_4x1x8x8_32x8x16_4023708073; do
            coverage run -p -m act.back_end --verify \
              --network "$ACT_NETS_DIR/$net.json" --solver dual --bab \
              --bab-branching babsr --bab-multi-split-levels 1 --verbose
          done

      # ── Coverage ───────────────────────────────────────────────────────
      - name: Combine coverage data
        if: always()
        run: |
          cd ${{ github.workspace }}
          coverage combine
          coverage xml -o coverage.xml
          coverage report

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: bab
          name: bab
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
