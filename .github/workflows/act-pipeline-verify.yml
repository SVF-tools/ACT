name: ACT Pipeline Verify Tests

# Front-end E2E verify via `act.pipeline --verify {vnnlib,torchvision}`.
# One step per benchmark; each step iterates the (TF, Solver) combos it
# supports. VNNLIB benchmarks (vnncomp2024 subset): acasxu_2023, dist_shift_2023,
# safenlp_2024 run all three combos (interval/hybridz/dual); collins_rul_cnn_2022
# runs dual only; vit_2023 (ViT) runs interval, hybridz, and dual.
# TorchVision MNIST +
# simple_cnn runs all three combos, exercising TOP1_ROBUST + MARGIN_ROBUST spec
# kinds. Factory-network verification lives in the backend CIs.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}
  TF_ENABLE_ONEDNN_OPTS: "0"
  ACT_CI_MODE: "true"

jobs:
  pipeline-verify:
    name: Pipeline Verify Tests
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Clean pip cache
        run: |
          pip cache purge

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install coverage onnx onnx2torch "onnx-simplifier" "onnxsim==0.6.5" tensorflow pandas numpy scipy highspy pyyaml tqdm psutil transformers scikit-learn

      - name: Fetch VNNLIB benchmarks (authenticated sparse checkout, avoids raw.githubusercontent rate-limit)
        uses: actions/checkout@v4
        with:
          repository: VNN-COMP/vnncomp2026_benchmarks
          path: _vnncomp_benchmarks
          sparse-checkout: |
            benchmarks/acasxu_2023/2.0
            benchmarks/dist_shift_2023/2.0
            benchmarks/safenlp_2024/2.0
            benchmarks/collins_rul_cnn_2022/2.0
            benchmarks/vit_2023/2.0

      - name: Stage and decompress benchmarks into data/vnnlib
        run: |
          cd ${{ github.workspace }}
          for cat in acasxu_2023 dist_shift_2023 safenlp_2024 collins_rul_cnn_2022 vit_2023; do
            src="_vnncomp_benchmarks/benchmarks/$cat/2.0"
            dst="data/vnnlib/$cat"
            mkdir -p "$dst"
            cp -r "$src"/. "$dst"/
            find "$dst" -name '*.gz' -exec gunzip -f {} +
          done
          rm -rf _vnncomp_benchmarks

      - name: Download TorchVision MNIST
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.front_end --download MNIST

      - name: Verify TorchVision MNIST + simple_cnn with verifier soundness validation
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.pipeline --verify torchvision --dataset MNIST --model simple_cnn --num-samples 1 --tf-modes interval --solvers torchlp --validate-soundness --device cpu --dtype float64

      - name: Verify acasxu_2023 (interval / hybridz / dual) with two-level soundness validation
        run: |
          cd ${{ github.workspace }}
          for combo in "--tf-modes interval --solvers torchlp" "--tf-modes hybridz --solvers torchlp" "--solvers dual"; do
            coverage run -p -m act.pipeline --verify vnnlib --category acasxu_2023 --max-instances 5 $combo --validate-soundness --device cpu --dtype float64
          done

      - name: Verify dist_shift_2023 (interval / hybridz / dual) with two-level soundness validation
        run: |
          cd ${{ github.workspace }}
          for combo in "--tf-modes interval --solvers torchlp" "--tf-modes hybridz --solvers torchlp" "--solvers dual"; do
            coverage run -p -m act.pipeline --verify vnnlib --category dist_shift_2023 --max-instances 5 $combo --validate-soundness --device cpu --dtype float64
          done

      - name: Verify safenlp_2024 (interval / hybridz / dual) with two-level soundness validation
        run: |
          cd ${{ github.workspace }}
          for combo in "--tf-modes interval --solvers torchlp" "--tf-modes hybridz --solvers torchlp" "--solvers dual"; do
            coverage run -p -m act.pipeline --verify vnnlib --category safenlp_2024 --max-instances 5 $combo --validate-soundness --device cpu --dtype float64
          done

      - name: Verify collins_rul_cnn_2022 (dual only — exercises backward_conv2d) with two-level soundness validation
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.pipeline --verify vnnlib --category collins_rul_cnn_2022 --max-instances 5 --solvers dual --validate-soundness --device cpu --dtype float64

      - name: Verify vit_2023 (interval / HybridZ TF + solver / dual) with two-level soundness validation
        run: |
          cd ${{ github.workspace }}
          for combo in "--tf-modes interval --solvers torchlp" "--tf-modes hybridz --solvers torchlp" "--solvers hybridz" "--solvers dual"; do
            coverage run -p -m act.pipeline --verify vnnlib --category vit_2023 --max-instances 1 $combo --validate-soundness --device cpu --dtype float64
          done

      - name: Verify TorchVision MNIST + simple_cnn (interval / hybridz / dual — TOP1_ROBUST + MARGIN_ROBUST spec coverage)
        run: |
          cd ${{ github.workspace }}
          for combo in "--tf-modes interval --solvers torchlp" "--tf-modes hybridz --solvers torchlp" "--solvers dual"; do
            coverage run -p -m act.pipeline --verify torchvision --dataset MNIST --model simple_cnn --num-samples 2 $combo --device cpu --dtype float64
          done

      # ─────────────────────────────────────────────────────────────────
      # TorchVision + BaB smoke (only the multi-sample per-sample iteration
      # path; VNNLIB BaB tiers live in act-bab.yml). Tightest possible budget
      # because simple_cnn has 25M params and we iterate 4-8 samples × 4
      # wrapped models. CI goal: exercise the code path, not converge.
      # ─────────────────────────────────────────────────────────────────
      - name: Verify TorchVision MNIST with BaB (single local-robustness instance)
        run: |
          cd ${{ github.workspace }}
          coverage run -p -m act.pipeline --verify torchvision --dataset MNIST --model simple_cnn --num-samples 1 \
            --solvers dual --bab --bab-solver-tier dual --bab-max-depth 1 --bab-max-nodes 1 \
            --device cpu --dtype float64

      - name: Combine coverage data
        if: always()
        run: |
          cd ${{ github.workspace }}
          coverage combine
          coverage xml -o coverage.xml
          coverage report

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: pipeline-verify
          name: pipeline-verify
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
