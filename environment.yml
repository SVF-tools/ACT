name: act-py312
channels:
  - gurobi
  - conda-forge
  - conda-pypi
  - nodefaults
dependencies:
  - python=3.12
  - onnx
  - onnxruntime
  - onnxconverter-common
  - onnxscript
  - pandas
  - numpy
  - networkx
  - tqdm
  - gurobi
  - ipykernel
  - ipywidgets  # Interactive trace explorer in Jupyter notebooks
  - matplotlib>=3.9
  - pyyaml  # Config loading (specs, models)
  - psutil  # Memory monitoring in pipeline
  # ML frameworks (pipeline/llm_probe.py)
  # Compact BERT uses the Transformers 4 tokenizer and encoder interfaces.
  - "transformers>=4.57.3,<5"
  - scikit-learn
  # Required for Mac OS X systems - `libopenblas` uses `llvm-openmp` by default,
  # which causes errors when using `pip`-installed PyTorch.
  - "libopenblas=*=*pthreads*"
  - pip
  - pip:
      # PyTorch via pip: the default Linux wheels are CUDA-enabled (cu124), whereas the
      # conda 'pytorch' channel yields a CPU-only build when this env is created on a
      # machine with no NVIDIA driver (the VNN-COMP installer). Installing via pip instead
      # of conda so the GPU build works on standard AWS run instances.
      - torch>=2.8
      - torchvision>=0.23
      # ONNX ecosystem - for VNNLib benchmarks
      - onnxsim==0.6.5
      - onnx2torch
